<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Watts Aviation — Live METAR Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Scale variables — set by JS based on screen resolution */
  :root {
    --s:       1;
    --bot:     80px;
    --side:    24px;
    --pad:     12px;
    --fxs:     0.60rem;
    --fsm:     0.72rem;
    --fbrand:  1.1rem;
    --btn-sz:  40px;
    --dot-sz:  10px;
    --wa-blue:   #2B3990;
    --wa-red:    #C1272D;
    --wa-panel:  rgba(8, 10, 18, 0.88);
    --wa-border: rgba(43, 57, 144, 0.45);
    --wa-text:   #c8cfe8;
    --wa-bright: #e8ecff;
    --vfr:  #00e676;
    --mvfr: #40a9ff;
    --ifr:  #C1272D;
    --lifr: #cc44ff;
    --unkn: #607d8b;
  }

  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Rajdhani',sans-serif; color:var(--wa-text); }

  #map { position:fixed; inset:0; z-index:1; }
  .leaflet-tile { filter:brightness(.75) saturate(.65); }
  .leaflet-control-zoom,
  .leaflet-control-attribution { display:none !important; }

  .ov { position:fixed; z-index:100; pointer-events:auto; }

  /* ── Title bar ── */
  #title-bar {
    top:0; left:50%; transform:translateX(-50%);
    background:var(--wa-panel);
    border:1px solid var(--wa-border); border-top:none;
    border-radius:0 0 14px 14px;
    padding:8px 28px 10px;
    text-align:center;
    backdrop-filter:blur(14px);
    white-space:nowrap;
  }
  .brand-row {
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .brand-wa {
    font-family:'Oswald', sans-serif;
    font-size:calc(1.15rem * var(--s));
    font-weight:700;
    letter-spacing:3px;
    color:var(--wa-bright);
  }
  .brand-wa .w { color:var(--wa-blue); }
  .brand-wa .a { color:var(--wa-red); }
  .brand-title {
    font-family:'Oswald', sans-serif;
    font-size:calc(var(--fbrand) * var(--s));
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--wa-bright);
    line-height:1;
  }
  .status-line {
    font-family:'Share Tech Mono', monospace;
    font-size:calc(var(--fxs) * var(--s));
    color:#4a5a80;
    letter-spacing:1px;
    margin-top:4px;
  }
  #status-msg { color:#7a8aaa; }

  /* ── Refresh (top right) ── */
  #refresh-panel {
    top:0; right:var(--side);
    background:var(--wa-panel);
    border:1px solid var(--wa-border); border-top:none;
    border-radius:0 0 10px 10px;
    padding:6px 12px;
    backdrop-filter:blur(14px);
    display:flex; align-items:center; gap:8px;
  }
  #last-update { font-family:'Share Tech Mono',monospace; font-size:calc(var(--fxs)*var(--s)); color:#3a4560; }
  .refresh-btn {
    background:none; border:1px solid var(--wa-border); border-radius:6px;
    color:#7a8aaa; cursor:pointer;
    font-size:calc(1rem * var(--s));
    width:calc(var(--btn-sz)*0.7); height:calc(var(--btn-sz)*0.7);
    display:flex; align-items:center; justify-content:center;
    transition:color .15s, border-color .15s;
  }
  .refresh-btn:hover { color:var(--wa-bright); border-color:var(--wa-blue); }

  /* ── Legend + zoom (bottom right) ── */
  #control-cluster {
    bottom:var(--bot); right:var(--side);
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
  }
  #legend {
    background:var(--wa-panel); border:1px solid var(--wa-border);
    border-radius:10px; padding:calc(var(--pad)*0.8) var(--pad);
    backdrop-filter:blur(14px);
  }
  .leg-title { font-size:calc(var(--fxs)*var(--s)); font-weight:700; letter-spacing:3px; color:#3a4560; text-transform:uppercase; margin-bottom:6px; }
  .leg { display:flex; align-items:center; gap:8px; font-size:calc(var(--fsm)*var(--s)); font-weight:600; letter-spacing:1px; margin-bottom:4px; color:var(--wa-bright); }
  .leg:last-child { margin-bottom:0; }
  .leg-dot { width:calc(var(--dot-sz)*var(--s)); height:calc(var(--dot-sz)*var(--s)); border-radius:50%; flex-shrink:0; box-shadow:0 0 6px currentColor; }

  #zoom-btns { display:flex; flex-direction:column; gap:4px; }
  .zoom-btn {
    width:calc(var(--btn-sz)*var(--s)); height:calc(var(--btn-sz)*var(--s));
    background:var(--wa-panel); border:1px solid var(--wa-border); border-radius:8px;
    color:var(--wa-bright); font-size:calc(1.4rem*var(--s)); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(14px); transition:background .15s,border-color .15s; user-select:none;
  }
  .zoom-btn:hover { background:rgba(43,57,144,.5); border-color:var(--wa-blue); }
  .zoom-btn:active { background:rgba(193,39,45,.4); }

  /* ── Airport search (bottom left) ── */
  #add-airport-panel {
    bottom:var(--bot); left:var(--side);
    background:var(--wa-panel); border:1px solid var(--wa-border);
    border-radius:10px; padding:calc(var(--pad)*0.75) var(--pad);
    backdrop-filter:blur(14px);
    display:flex; gap:6px; align-items:center;
  }
  #airport-input {
    background:rgba(0,0,12,.55); border:1px solid var(--wa-border); border-radius:6px;
    color:var(--wa-bright); font-family:'Share Tech Mono',monospace;
    font-size:calc(var(--fsm)*var(--s));
    padding:6px 10px; width:calc(160px*var(--s)); text-transform:uppercase; outline:none;
  }
  #airport-input::placeholder { color:#2a3450; text-transform:none; }
  #airport-input:focus { border-color:var(--wa-blue); }
  .sm-btn {
    background:var(--wa-blue); border:none; border-radius:6px; color:#fff; cursor:pointer;
    font-family:'Rajdhani',sans-serif; font-weight:700;
    font-size:calc(var(--fsm)*var(--s));
    letter-spacing:1px; padding:6px 10px; text-transform:uppercase; transition:opacity .15s; white-space:nowrap;
  }
  .sm-btn:hover { opacity:.8; }
  .sm-btn.red { background:var(--wa-red); }

  /* ── Zoom indicator (bottom center) ── */
  #zoom-indicator {
    bottom:var(--bot); left:50%; transform:translateX(-50%);
    background:var(--wa-panel); border:1px solid var(--wa-border); border-radius:8px;
    padding:4px 14px; backdrop-filter:blur(14px);
    font-family:'Share Tech Mono',monospace; font-size:calc(var(--fxs)*var(--s)); color:#3a4560;
    white-space:nowrap; pointer-events:none;
  }
  #zoom-indicator span { color:#7a8aaa; }

  /* ── Loading ── */
  #loading {
    position:fixed; inset:0; z-index:999;
    background:rgba(0,0,10,.9);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    pointer-events:none;
  }
  .wa-spinner {
    width:calc(52px*var(--s)); height:calc(52px*var(--s));
    border:3px solid rgba(43,57,144,.25);
    border-top-color:var(--wa-blue); border-right-color:var(--wa-red);
    border-radius:50%; animation:spin .9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-family:'Share Tech Mono',monospace; font-size:calc(var(--fsm)*var(--s)); letter-spacing:3px; color:#3a4a70; }

  /* ── Popups ── */
  .leaflet-popup-content-wrapper { background:#0a0e1c; border:1px solid var(--wa-border); border-radius:10px; color:var(--wa-text); box-shadow:0 4px 24px rgba(0,0,0,.7); }
  .leaflet-popup-tip { background:#0a0e1c; }
  .leaflet-popup-close-button { color:#7a8aaa !important; }
  .metar-popup { font-family:'Share Tech Mono',monospace; font-size:0.75rem; line-height:1.75; min-width:220px; }
  .metar-popup .icao { font-family:'Oswald',sans-serif; font-size:1.3rem; font-weight:600; color:var(--wa-bright); margin-bottom:2px; letter-spacing:2px; }
  .metar-popup .cat-badge { display:inline-block; padding:2px 10px; border-radius:4px; font-size:0.65rem; font-weight:700; letter-spacing:1px; margin-bottom:8px; color:#000; }
  .metar-popup table { width:100%; border-collapse:collapse; }
  .metar-popup td { padding:1px 0; }
  .metar-popup td:first-child { color:#3a5070; padding-right:10px; width:70px; }
  .metar-popup .raw { background:rgba(255,255,255,.05); border-radius:4px; padding:5px 8px; font-size:0.62rem; word-break:break-all; margin-top:8px; color:#5a6a8a; border:1px solid rgba(255,255,255,.06); }

  /* ── Mobile bottom sheet ── */
  #mobile-fab {
    display:none;
    position:fixed; bottom:20px; right:16px; z-index:110;
    width:52px; height:52px;
    background:var(--wa-blue); border:none; border-radius:50%;
    color:#fff; font-size:1.3rem; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.5);
    align-items:center; justify-content:center;
  }
  #mobile-sheet {
    display:none;
    position:fixed; bottom:0; left:0; right:0; z-index:105;
    background:rgba(8,10,18,0.97);
    border-top:1px solid var(--wa-border);
    border-radius:16px 16px 0 0;
    padding:1rem 1.25rem 1.5rem;
    backdrop-filter:blur(16px);
    flex-direction:column; gap:1rem;
    transform:translateY(100%);
    transition:transform 0.3s ease;
  }
  #mobile-sheet.open { transform:translateY(0); }
  .sheet-handle { width:36px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; margin:0 auto 0.5rem; }
  .sheet-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sheet-row label { font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; color:#3a4560; display:block; margin-bottom:4px; }
  #mobile-airport-input {
    flex:1; background:rgba(0,0,12,.6); border:1px solid var(--wa-border); border-radius:6px;
    color:var(--wa-bright); font-family:'Share Tech Mono',monospace;
    font-size:0.85rem; padding:8px 12px; text-transform:uppercase; outline:none;
  }
  .sheet-legend { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .sheet-leg-item { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:0.65rem; font-weight:700; letter-spacing:1px; color:var(--wa-bright); }
  .sheet-leg-dot { width:14px; height:14px; border-radius:50%; box-shadow:0 0 8px currentColor; }
  .sheet-zoom-row { display:flex; justify-content:center; gap:12px; }
  .sheet-zoom-btn { width:52px; height:52px; background:rgba(43,57,144,.3); border:1px solid var(--wa-border); border-radius:10px; color:var(--wa-bright); font-size:1.6rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  @media (max-width:700px) {
    #control-cluster, #add-airport-panel, #zoom-indicator, #refresh-panel { display:none !important; }
    #mobile-fab   { display:flex; }
    #mobile-sheet { display:flex; }
    #title-bar { padding:6px 16px 8px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- Title bar -->
<div class="ov" id="title-bar">
  <div class="brand-row">
    <div class="brand-wa"><span class="w">W</span>atts <span class="a">A</span>viation</div>
    <div class="brand-title">— Live METAR Map</div>
  </div>
  <div class="status-line"><span id="status-msg">Initializing…</span></div>
</div>

<!-- Refresh -->
<div class="ov" id="refresh-panel">
  <span id="last-update">--:-- Z</span>
  <button class="refresh-btn" onclick="refreshAll()" title="Refresh">⟳</button>
</div>

<!-- Legend + zoom -->
<div class="ov" id="control-cluster">
  <div id="legend">
    <div class="leg-title">Flight Category</div>
    <div class="leg"><span class="leg-dot" style="background:var(--vfr);color:var(--vfr)"></span>VFR</div>
    <div class="leg"><span class="leg-dot" style="background:var(--mvfr);color:var(--mvfr)"></span>MVFR</div>
    <div class="leg"><span class="leg-dot" style="background:var(--ifr);color:var(--ifr)"></span>IFR</div>
    <div class="leg"><span class="leg-dot" style="background:var(--lifr);color:var(--lifr)"></span>LIFR</div>
    <div class="leg"><span class="leg-dot" style="background:var(--unkn);color:var(--unkn)"></span>UNKN</div>
  </div>
  <div id="zoom-btns">
    <button class="zoom-btn" onclick="map.zoomIn()">+</button>
    <button class="zoom-btn" onclick="map.zoomOut()">−</button>
  </div>
</div>

<!-- Airport search -->
<div class="ov" id="add-airport-panel">
  <input type="text" id="airport-input" placeholder="Add ICAO: KCLL KDFW …">
  <button class="sm-btn" onclick="addAirports()">Add</button>
  <button class="sm-btn red" onclick="resetView()">Reset</button>
</div>

<!-- Zoom indicator -->
<div class="ov" id="zoom-indicator">
  Zoom <span id="zoom-level">5</span> · <span id="station-count">0</span> stations
</div>

<!-- Loading -->
<div id="loading">
  <div class="wa-spinner"></div>
  <div class="loading-text" id="loading-text">FETCHING METAR DATA…</div>
</div>

<!-- Mobile FAB + sheet -->
<button id="mobile-fab" onclick="toggleSheet()">☰</button>

<div id="mobile-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-legend">
    <div class="sheet-leg-item"><div class="sheet-leg-dot" style="background:var(--vfr);color:var(--vfr)"></div>VFR</div>
    <div class="sheet-leg-item"><div class="sheet-leg-dot" style="background:var(--mvfr);color:var(--mvfr)"></div>MVFR</div>
    <div class="sheet-leg-item"><div class="sheet-leg-dot" style="background:var(--ifr);color:var(--ifr)"></div>IFR</div>
    <div class="sheet-leg-item"><div class="sheet-leg-dot" style="background:var(--lifr);color:var(--lifr)"></div>LIFR</div>
    <div class="sheet-leg-item"><div class="sheet-leg-dot" style="background:var(--unkn);color:var(--unkn)"></div>UNKN</div>
  </div>
  <div class="sheet-zoom-row">
    <button class="sheet-zoom-btn" onclick="map.zoomIn()">+</button>
    <button class="sheet-zoom-btn" onclick="refreshAll()">⟳</button>
    <button class="sheet-zoom-btn" onclick="map.zoomOut()">−</button>
  </div>
  <div>
    <label>Add Airport (ICAO)</label>
    <div class="sheet-row">
      <input type="text" id="mobile-airport-input" placeholder="KCLL KDFW …">
      <button class="sm-btn" onclick="addAirportsMobile()">Add</button>
      <button class="sm-btn red" onclick="resetView()">Reset</button>
    </div>
  </div>
  <div class="status-line" style="text-align:center;padding-top:4px;"><span id="status-msg-mobile">—</span></div>
</div>

<script>
// ── Resolution scaling + wallpaper mode ──────────────────────
(function applyScale() {
  const params    = new URLSearchParams(location.search);
  const wallpaper = params.has('wallpaper') || params.has('wp');
  const root      = document.documentElement;
  const sw        = screen.width;
  const dpr       = devicePixelRatio || 1;
  const isUHD     = sw >= 3840 || (sw >= 2560 && dpr >= 1.5);
  const isQHD     = sw >= 2560 && !isUHD;
  const scale     = isUHD ? 1.4 : isQHD ? 1.2 : 1.0;

  root.style.setProperty('--s',      scale);
  root.style.setProperty('--side',   Math.round(24 * scale) + 'px');
  root.style.setProperty('--pad',    Math.round(12 * scale) + 'px');
  root.style.setProperty('--btn-sz', Math.round(40 * scale) + 'px');
  root.style.setProperty('--dot-sz', Math.round(10 * scale) + 'px');

  const taskbarH = isUHD ? Math.round(100 * scale) : 72;
  root.style.setProperty('--bot', (wallpaper ? taskbarH : 80) + 'px');
})();

// ── Proxy ────────────────────────────────────────────────────
const PROXY = 'https://project-2rt0o.vercel.app/api/metar';

// ── Airport tiers ────────────────────────────────────────────
// zoom < 5   → TIER_MAJOR only
// zoom 5–5.9 → TIER_MAJOR + TIER_REGIONAL
// zoom ≥ 6   → Bounding box (all stations in view — no dead spots)
const TIER_MAJOR = [
  'KATL','KLAX','KORD','KDFW','KDEN','KJFK','KSFO','KLAS',
  'KMCO','KSEA','KEWR','KPHX','KIAH','KMIA','KBOS','KMSP',
  'KDTW','KPHL','KLGA','KFLL','KBWI','KSLC','KIAD','KMDW',
  'KHOU','KSAN','KTPA','KPDX','KSTL','KBNA','KMKE','KAUS',
  'KSAT','KSJC','KOAK','KABQ','KMEM','KCVG','KIND','KCLT',
  'KRDU','KPIT','KCLE','KBUF','KMSY','KRSW','KSMF','KONT',
  'KJAX','KBHM','KJAN','KHSV','KCHA','KBTR','KTLH','KSAV',
  'KTUL','KOKC','KELP','KAMA','KLBB',
  'KCOS','KBIL','KGJT','KRNO','KBOI','KGEG',
  'KDSM','KOMA','KMCI','KFAR','KRAP',
  'PANC','PHNL',
];

const TIER_REGIONAL = [
  // Northeast
  'KBDL','KPVD','KALB','KSYR','KROC','KBGR','KBTV','KPWM','KELM','KIAG','KBGM','KHPN','KACK','KHYA',
  // Mid-Atlantic
  'KDCA','KRIC','KCHO','KHGR','KSBY','KISP','KORF',
  // Southeast
  'KCAE','KMYR','KGSO','KAVL','KECP','KVPS','KPNS','KMOB','KGPT','KLFT',
  'KGNV','KDAB','KMLB','KFPR','KPBI','KEYW','KPFN','KVLD','KABY','KCSG','KMGM','KDHN',
  // Texas
  'KABI','KMAF','KTYR','KACT','KSPS','KGGG','KBRO','KCRP','KGRK','KSJT',
  'KDRT','KALI','KGTU','KCLL','KLVJ','KDWH','KSGR','KCXO','KLBX','KUTS','KVCT','KILE','KGLS','KHPY',
  // OK / AR / MO
  'KFSM','KXNA','KSGF','KFYV','KTBN','KJLN','KLAW','KEND','KPWA',
  // Midwest
  'KGRR','KSBN','KLAN','KFWA','KDAY','KCMH','KTOL','KCID','KSUX','KFSD','KMLI','KPIA','KRFD','KMSN',
  // Great Plains / Dakotas
  'KBIS','KGFK','KABR','KSDY','KISN','KCDR','KLND',
  // Mountain West
  'KPUB','KHLN','KGTF','KCOD','KCYS','KPRC','KFLG','KTUS','KYUM','KROW',
  'KSAF','KALS','KGUC','KEGE','KBZN','KHVR','KGDV','KMLS','KDLN','KLWS','KSMN','KSUN',
  // Pacific
  'KEUG','KMFR','KRDM','KTAC','KFAT','KBAK','KLMT','KMRY','KSBP','KSBA','KRDD','KACV','KCRQ','KLGB','KSNA','KVNY',
  // Alaska
  'PAJN','KFAI','PABT','PAKN','PADQ','PAFA',
  // Hawaii
  'PHOG','PHTO','PHHI','PHMK','PHLI',
];

// ── Flight category ──────────────────────────────────────────
const CAT = {
  VFR:  { color:'#00e676', radius:10 },
  MVFR: { color:'#40a9ff', radius:10 },
  IFR:  { color:'#C1272D', radius:12 },
  LIFR: { color:'#cc44ff', radius:14 },
  UNKN: { color:'#607d8b', radius:8  },
};

function flightCategory(m) {
  if (m.flightCategory && m.flightCategory !== '') return m.flightCategory;
  const ceil = (m.clouds||[]).reduce((lo,c) => {
    if (['BKN','OVC','OVX'].includes(c.cover)) return Math.min(lo, c.base??99999);
    return lo;
  }, 99999);
  const vis = m.visib??99;
  if (ceil < 500  || vis < 1) return 'LIFR';
  if (ceil < 1000 || vis < 3) return 'IFR';
  if (ceil < 3000 || vis < 5) return 'MVFR';
  return 'VFR';
}

// ── Map init ─────────────────────────────────────────────────
const map = L.map('map', { zoomControl:false, scrollWheelZoom:true })
              .setView([37.5, -96.0], 5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains:'abcd', maxZoom:19
}).addTo(map);

let markers={}, pinnedIcaos=new Set(), fetchTimer=null, isFetching=false, lastZoom=null;

// ── Fetch helpers ────────────────────────────────────────────
async function fetchByIds(list) {
  if (!list.length) return [];
  const res = await fetch(`${PROXY}?ids=${list.join(',')}`, { signal:AbortSignal.timeout(15000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function fetchByBounds(bounds) {
  const pad=0.5;
  const url=`${PROXY}?bbox=${(bounds.getSouth()-pad).toFixed(4)},${(bounds.getWest()-pad).toFixed(4)},${(bounds.getNorth()+pad).toFixed(4)},${(bounds.getEast()+pad).toFixed(4)}`;
  const res = await fetch(url, { signal:AbortSignal.timeout(18000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── Main refresh ─────────────────────────────────────────────
async function refreshAll() {
  if (isFetching) return;
  isFetching = true;
  const zoom = map.getZoom();
  document.getElementById('zoom-level').textContent = Math.round(zoom*10)/10;
  document.getElementById('loading').style.display = 'flex';
  setStatus('Fetching METARs…');

  try {
    let data = [];

    if (zoom >= 6) {
      document.getElementById('loading-text').textContent = 'LOADING ALL STATIONS IN VIEW…';
      data = await fetchByBounds(map.getBounds());
      if (pinnedIcaos.size) {
        const missing = [...pinnedIcaos].filter(id => !data.find(m=>m.icaoId===id));
        if (missing.length) data = [...data, ...await fetchByIds(missing)];
      }
      pruneOutOfViewMarkers();

    } else if (zoom >= 5) {
      document.getElementById('loading-text').textContent = 'FETCHING METAR DATA…';
      data = await fetchByIds([...new Set([...TIER_MAJOR,...TIER_REGIONAL,...pinnedIcaos])]);
      pruneByTier(zoom);

    } else {
      document.getElementById('loading-text').textContent = 'FETCHING METAR DATA…';
      data = await fetchByIds([...new Set([...TIER_MAJOR,...pinnedIcaos])]);
      pruneByTier(zoom);
    }

    if (!data.length) { setStatus('⚠ No data returned'); return; }
    data.forEach(upsertMarker);

    const cats = data.reduce((acc,m) => {
      const c=flightCategory(m); acc[c]=(acc[c]||0)+1; return acc;
    },{});
    const summary = Object.entries(cats).map(([k,v])=>`${v} ${k}`).join(' · ');
    setStatus(`${data.length} stations · ${summary}`);
    document.getElementById('station-count').textContent = data.length;
    document.getElementById('last-update').textContent = new Date().toUTCString().slice(17,22)+'Z';

  } catch(err) {
    setStatus('⚠ Fetch error — check console');
    console.error(err);
  } finally {
    document.getElementById('loading').style.display = 'none';
    isFetching = false;
  }
}

// ── Marker management ────────────────────────────────────────
function buildPopup(m) {
  const cat=flightCategory(m), cfg=CAT[cat]||CAT.UNKN;
  const wind = m.wdir!=null
    ? `${String(m.wdir).padStart(3,'0')}° @ ${m.wspd??'?'}kt${m.wgst?` G${m.wgst}`:''}`
    : 'Calm / VRB';
  const cloudStr = m.clouds?.length
    ? m.clouds.map(c=>`${c.cover} @ ${c.base??'?'}ft`).join(', ')
    : 'SKC / CLR';
  const obsTime = m.reportTime ? new Date(m.reportTime).toUTCString().replace('GMT','Z') : '—';
  return `<div class="metar-popup">
    <div class="icao">${m.icaoId}</div>
    <span class="cat-badge" style="background:${cfg.color}">${cat}</span>
    <table>
      <tr><td>Wind</td><td>${wind}</td></tr>
      <tr><td>Visibility</td><td>${m.visib!=null?m.visib+' SM':'—'}</td></tr>
      <tr><td>Clouds</td><td>${cloudStr}</td></tr>
      <tr><td>Wx</td><td>${m.wxString||'—'}</td></tr>
      <tr><td>Temp/Dew</td><td>${m.temp!=null?m.temp+'°C / '+(m.dewp??'?')+'°C':'—'}</td></tr>
      <tr><td>Altimeter</td><td>${m.altim!=null?parseFloat(m.altim).toFixed(2)+' inHg':'—'}</td></tr>
      <tr><td>Observed</td><td>${obsTime}</td></tr>
    </table>
    <div class="raw">${m.rawOb||''}</div>
  </div>`;
}

function upsertMarker(m) {
  if (!m.lat||!m.lon) return;
  const cat=flightCategory(m), cfg=CAT[cat]||CAT.UNKN;
  const zoom=map.getZoom(), baseR=cfg.radius;
  const r     = zoom>=8?baseR+4:zoom>=6?baseR:baseR-2;
  const fSize = zoom>=8?'9px':zoom>=6?'7px':'5px';
  const label = zoom>=5?m.icaoId.replace(/^K/,''):'';
  const icon  = L.divIcon({
    className:'',
    html:`<div style="width:${r*2}px;height:${r*2}px;background:${cfg.color};border-radius:50%;border:2px solid rgba(255,255,255,.2);box-shadow:0 0 10px ${cfg.color},0 0 3px #000;display:flex;align-items:center;justify-content:center;font-size:${fSize};font-weight:700;color:#000;font-family:'Rajdhani',sans-serif;letter-spacing:.3px;">${label}</div>`,
    iconSize:[r*2,r*2], iconAnchor:[r,r],
  });
  if (markers[m.icaoId]) {
    markers[m.icaoId].setLatLng([m.lat,m.lon]);
    markers[m.icaoId].setIcon(icon);
    markers[m.icaoId].getPopup().setContent(buildPopup(m));
  } else {
    markers[m.icaoId] = L.marker([m.lat,m.lon],{icon})
      .addTo(map).bindPopup(buildPopup(m),{maxWidth:320});
  }
}

function pruneOutOfViewMarkers() {
  const bounds = map.getBounds().pad(0.3);
  Object.entries(markers).forEach(([icao,mk]) => {
    if (!bounds.contains(mk.getLatLng())&&!pinnedIcaos.has(icao)) {
      map.removeLayer(mk); delete markers[icao];
    }
  });
}

function pruneByTier(zoom) {
  const keep = new Set([...TIER_MAJOR,...(zoom>=5?TIER_REGIONAL:[]),...pinnedIcaos]);
  Object.keys(markers).forEach(icao => {
    if (!keep.has(icao)) { map.removeLayer(markers[icao]); delete markers[icao]; }
  });
}

// ── Map events ───────────────────────────────────────────────
function scheduleRefresh(delay=800) {
  if (fetchTimer) clearTimeout(fetchTimer);
  fetchTimer = setTimeout(refreshAll, delay);
}

map.on('zoomend', () => {
  const newZoom = map.getZoom();
  document.getElementById('zoom-level').textContent = Math.round(newZoom*10)/10;
  // Zooming out — clear non-pinned markers so stale dots don't linger
  if (lastZoom !== null && newZoom < lastZoom) {
    Object.keys(markers).forEach(icao => {
      if (!pinnedIcaos.has(icao)) { map.removeLayer(markers[icao]); delete markers[icao]; }
    });
  }
  lastZoom = newZoom;
  scheduleRefresh(600);
});

map.on('moveend', () => { if (map.getZoom()>=6) scheduleRefresh(1000); });

// ── UI helpers ───────────────────────────────────────────────
function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
  const mob = document.getElementById('status-msg-mobile');
  if (mob) mob.textContent = msg;
}

function addAirports() {
  parseAndPin(document.getElementById('airport-input').value);
  document.getElementById('airport-input').value = '';
}

function addAirportsMobile() {
  parseAndPin(document.getElementById('mobile-airport-input').value);
  document.getElementById('mobile-airport-input').value = '';
}

function parseAndPin(raw) {
  const codes = raw.toUpperCase().split(/[\s,]+/).filter(s=>/^[A-Z]{4}$/.test(s));
  if (!codes.length) { alert('Enter valid 4-letter ICAO codes'); return; }
  codes.forEach(icao=>pinnedIcaos.add(icao));
  refreshAll();
}

function resetView() {
  pinnedIcaos.clear();
  Object.values(markers).forEach(mk=>map.removeLayer(mk));
  markers = {};
  map.setView([37.5,-96.0],5);
  refreshAll();
  toggleSheet(false);
}

document.getElementById('airport-input')
  .addEventListener('keydown', e => { if (e.key==='Enter') addAirports(); });

function toggleSheet(force) {
  const sheet = document.getElementById('mobile-sheet');
  const open  = force!==undefined ? force : !sheet.classList.contains('open');
  sheet.classList.toggle('open', open);
}

setInterval(refreshAll, 5*60*1000);
refreshAll();
</script>
