<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METAR Flight Category Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --vfr:   #00e676;
    --mvfr:  #2979ff;
    --ifr:   #ff1744;
    --lifr:  #aa00ff;
    --unkn:  #78909c;
    --bg:    #0a0e17;
    --panel: #111827;
    --border:#1e2d40;
    --text:  #cfd8dc;
    --head:  #e8f4fd;
  }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(135deg, #0d1b2a 0%, #1a2f4e 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .logo-area { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #1565c0, #0288d1);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.2rem;
    color: var(--head);
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 0.72rem;
    color: #607d8b;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .controls input {
    background: #0d1b2a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--head);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    padding: 7px 12px;
    width: 220px;
    text-transform: uppercase;
  }
  .controls input::placeholder { color: #455a64; text-transform: none; }
  .controls input:focus { outline: none; border-color: #1565c0; }

  .btn {
    background: linear-gradient(135deg, #1565c0, #0288d1);
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 1px;
    padding: 8px 16px;
    text-transform: uppercase;
    transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn.secondary {
    background: #1e2d40;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .leg {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 600; letter-spacing: .5px;
  }

  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 6px currentColor;
  }

  #status-bar {
    background: #0d1b2a;
    border-bottom: 1px solid var(--border);
    padding: 6px 24px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: #607d8b;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #status-bar span { color: #90a4ae; }

  #map {
    flex: 1;
    min-height: 480px;
  }

  .metar-popup {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.6;
    min-width: 200px;
    max-width: 280px;
  }

  .metar-popup .icao {
    font-family: 'Barlow', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .metar-popup .cat-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .metar-popup .raw {
    background: #f5f5f5;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 0.68rem;
    word-break: break-all;
    margin-top: 8px;
    color: #333;
  }

  .metar-popup table { width: 100%; border-collapse: collapse; }
  .metar-popup td { padding: 2px 0; }
  .metar-popup td:first-child { color: #607d8b; padding-right: 8px; }

  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 10px 24px;
    font-size: 0.72rem;
    color: #455a64;
    text-align: center;
  }
  footer a { color: #607d8b; }

  #loading {
    position: absolute;
    inset: 0;
    background: rgba(10,14,23,.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    gap: 16px;
    font-family: 'Share Tech Mono', monospace;
    color: #90a4ae;
    font-size: 0.9rem;
    letter-spacing: 2px;
    pointer-events: none;
  }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #1e2d40;
    border-top-color: #0288d1;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .leaflet-tile { filter: brightness(.85) saturate(.9); }
  .leaflet-popup-content-wrapper { background: #fff; color: #222; }

  /* Error/debug panel */
  #debug-panel {
    display: none;
    background: #1a0a0a;
    border: 1px solid #5c1a1a;
    border-radius: 6px;
    color: #ff8a80;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    margin: 8px 24px;
    padding: 10px 14px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo-icon">✈</div>
    <div>
      <h1>METAR FLIGHT CATEGORY MAP</h1>
      <div class="subtitle">Live Aviation Weather · Auto-refreshes every 5 min</div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="airport-input"
      placeholder="Add airports: KCLL KHOU KDFW …"
      title="Space or comma-separated ICAO codes">
    <button class="btn" onclick="addAirports()">Add</button>
    <button class="btn secondary" onclick="resetDefaults()">Reset</button>
    <button class="btn secondary" onclick="refreshAll()">⟳ Refresh</button>
  </div>

  <div class="legend">
    <div class="leg"><span class="dot" style="background:var(--vfr);color:var(--vfr)"></span> VFR</div>
    <div class="leg"><span class="dot" style="background:var(--mvfr);color:var(--mvfr)"></span> MVFR</div>
    <div class="leg"><span class="dot" style="background:var(--ifr);color:var(--ifr)"></span> IFR</div>
    <div class="leg"><span class="dot" style="background:var(--lifr);color:var(--lifr)"></span> LIFR</div>
    <div class="leg"><span class="dot" style="background:var(--unkn);color:var(--unkn)"></span> Unknown</div>
  </div>
</header>

<div id="status-bar">
  <span id="status-msg">Initializing…</span>
  <span id="last-update"></span>
</div>

<!-- Debug panel shown only on errors -->
<div id="debug-panel" id="debug-panel"></div>

<div style="position:relative;flex:1;display:flex;flex-direction:column;">
  <div id="map"></div>
  <div id="loading">
    <div class="spinner"></div>
    FETCHING METAR DATA…
  </div>
</div>

<footer>
  Data: <a href="https://aviationweather.gov" target="_blank">Aviation Weather Center (NOAA)</a> ·
  Map: <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a> ·
  METARs for situational awareness only — always get official briefing via
  <a href="https://1800wxbrief.com" target="_blank">1800wxbrief.com</a>
</footer>

<script>
// ─────────────────────────────────────────────────────────────────
//  CONFIGURATION — edit airport list here
// ─────────────────────────────────────────────────────────────────
let airports = [
  'KCLL','KHOU','KDFW','KSAT','KAUS','KIAH','KELP','KAMA',
  'KLBB','KABI','KMAF','KTYR','KACT','KSPS','KGGG','KBRO'
];

// ─────────────────────────────────────────────────────────────────
//  FLIGHT CATEGORY
// ─────────────────────────────────────────────────────────────────
const CAT = {
  VFR:  { color: '#00e676', radius: 10 },
  MVFR: { color: '#2979ff', radius: 10 },
  IFR:  { color: '#ff1744', radius: 12 },
  LIFR: { color: '#aa00ff', radius: 14 },
  UNKN: { color: '#78909c', radius: 8  },
};

function flightCategory(m) {
  if (m.flightCategory && m.flightCategory !== '') return m.flightCategory;
  const ceil = (m.clouds || []).reduce((lo, c) => {
    if (['BKN','OVC','OVX'].includes(c.cover)) return Math.min(lo, c.base ?? 99999);
    return lo;
  }, 99999);
  const vis = m.visib ?? 99;
  if (ceil < 500  || vis < 1) return 'LIFR';
  if (ceil < 1000 || vis < 3) return 'IFR';
  if (ceil < 3000 || vis < 5) return 'MVFR';
  return 'VFR';
}

// ─────────────────────────────────────────────────────────────────
//  MAP SETUP
// ─────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([31.5, -97.5], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

let markers   = {};
let metarData = {};

// ─────────────────────────────────────────────────────────────────
//  FETCH — tries direct, then two CORS proxies as fallback
// ─────────────────────────────────────────────────────────────────
async function fetchMetars(icaoList) {
  const API_KEY = c4f63a28bdab46ac8dffbdeb5305cbd8;  // ← your key goes here
  const ids = icaoList.join(',');
  const url = `https://api.checkwx.com/metar/${ids}/decoded`;

  try {
    setStatus('Fetching METARs…');
    const res = await fetch(url, {
      headers: { 'X-API-Key': API_KEY },
      signal: AbortSignal.timeout(10000)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.data || !json.data.length) throw new Error('No data returned');

    // Translate CheckWX format to match what the rest of the code expects
    return json.data.map(m => ({
      icaoId:         m.icao,
      lat:            m.station?.geometry?.coordinates?.[1],
      lon:            m.station?.geometry?.coordinates?.[0],
      flightCategory: m.flight_category,
      rawOb:          m.raw_text,
      reportTime:     m.observed,
      wdir:           m.wind?.degrees,
      wspd:           m.wind?.speed_kts,
      wgst:           m.wind?.gust_kts,
      visib:          m.visibility?.miles_float,
      temp:           m.temperature?.celsius,
      dewp:           m.dewpoint?.celsius,
      altim:          m.barometer?.mb ? m.barometer.mb * 0.02953 / 0.02953 : null,
      wxString:       m.conditions?.map(c => c.code).join(' ') || null,
      clouds:         (m.clouds || []).map(c => ({
                        cover: c.code,
                        base:  c.base_feet_agl
                      }))
    }));
  } catch (err) {
    showDebug(`CheckWX fetch failed: ${err.message}`);
    console.error('METAR fetch error:', err);
    return [];
  }
}

// ─────────────────────────────────────────────────────────────────
//  POPUP
// ─────────────────────────────────────────────────────────────────
function buildPopup(m) {
  const cat = flightCategory(m);
  const cfg = CAT[cat] || CAT.UNKN;

  const wind = m.wdir != null
    ? `${String(m.wdir).padStart(3,'0')}° @ ${m.wspd ?? '?'}kt${m.wgst ? ` G${m.wgst}` : ''}`
    : 'Calm / VRB';

  const vis      = m.visib  != null ? `${m.visib} SM` : '—';
  const temp     = m.temp   != null ? `${m.temp}°C / ${m.dewp ?? '?'}°C dew` : '—';
  const alt      = m.altim  != null ? `${(m.altim * 0.02953).toFixed(2)} inHg` : '—';
  const cloudStr = m.clouds && m.clouds.length
    ? m.clouds.map(c => `${c.cover} @ ${c.base ?? '?'}ft`).join(', ')
    : 'SKC / CLR';
  const wxStr    = m.wxString || '—';
  const obsTime  = m.reportTime
    ? new Date(m.reportTime).toUTCString().replace('GMT','Z')
    : '—';

  return `
    <div class="metar-popup">
      <div class="icao">${m.icaoId}</div>
      <span class="cat-badge" style="background:${cfg.color};color:#000">${cat}</span>
      <table>
        <tr><td>Wind</td><td>${wind}</td></tr>
        <tr><td>Visibility</td><td>${vis}</td></tr>
        <tr><td>Clouds</td><td>${cloudStr}</td></tr>
        <tr><td>Wx</td><td>${wxStr}</td></tr>
        <tr><td>Temp/Dew</td><td>${temp}</td></tr>
        <tr><td>Altimeter</td><td>${alt}</td></tr>
        <tr><td>Observed</td><td>${obsTime}</td></tr>
      </table>
      <div class="raw">${m.rawOb || ''}</div>
    </div>`;
}

// ─────────────────────────────────────────────────────────────────
//  MARKERS
// ─────────────────────────────────────────────────────────────────
function upsertMarker(m) {
  if (!m.lat || !m.lon) return;
  const cat = flightCategory(m);
  const cfg = CAT[cat] || CAT.UNKN;
  const r   = cfg.radius;

  const icon = L.divIcon({
    className: '',
    html: `<div style="
        width:${r*2}px;height:${r*2}px;
        background:${cfg.color};
        border-radius:50%;
        border:2px solid rgba(255,255,255,.4);
        box-shadow:0 0 8px ${cfg.color},0 0 2px #000;
        display:flex;align-items:center;justify-content:center;
        font-size:7px;font-weight:700;color:#000;
        font-family:'Barlow',sans-serif;letter-spacing:.5px;
      ">${m.icaoId.replace(/^K/,'')}</div>`,
    iconSize:   [r*2, r*2],
    iconAnchor: [r,   r  ],
  });

  if (markers[m.icaoId]) {
    markers[m.icaoId].setLatLng([m.lat, m.lon]);
    markers[m.icaoId].setIcon(icon);
    markers[m.icaoId].getPopup().setContent(buildPopup(m));
  } else {
    markers[m.icaoId] = L.marker([m.lat, m.lon], { icon })
      .addTo(map)
      .bindPopup(buildPopup(m), { maxWidth: 320 });
  }
  metarData[m.icaoId] = m;
}

// ─────────────────────────────────────────────────────────────────
//  MAIN REFRESH
// ─────────────────────────────────────────────────────────────────
async function refreshAll() {
  document.getElementById('loading').style.display = 'flex';
  setStatus('Fetching METARs…');

  const data = await fetchMetars(airports);

  if (!data.length) {
    setStatus('⚠ All fetch attempts failed — see details below.');
    showDebug('All three methods failed. If you are running this as a local file, try hosting it on GitHub Pages or Netlify (free). See the README in the email for instructions.');
    document.getElementById('loading').style.display = 'none';
    return;
  }

  data.forEach(upsertMarker);

  const cats = data.reduce((acc, m) => {
    const c = flightCategory(m); acc[c] = (acc[c]||0)+1; return acc;
  }, {});

  const summary = Object.entries(cats).map(([k,v]) => `${v} ${k}`).join(' · ');
  setStatus(`${data.length} stations · ${summary}`);
  document.getElementById('last-update').textContent =
    'Updated: ' + new Date().toUTCString().replace('GMT','Z');
  document.getElementById('loading').style.display = 'none';
}

// ─────────────────────────────────────────────────────────────────
//  UI HELPERS
// ─────────────────────────────────────────────────────────────────
function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

let debugLines = [];
function showDebug(msg) {
  debugLines.push(msg);
  const p = document.getElementById('debug-panel');
  p.style.display = 'block';
  p.innerHTML = '<strong>Debug log:</strong><br>' + debugLines.join('<br>');
}
function hideDebug() {
  debugLines = [];
  const p = document.getElementById('debug-panel');
  p.style.display = 'none';
  p.innerHTML = '';
}

function addAirports() {
  const raw = document.getElementById('airport-input').value;
  const newOnes = raw.toUpperCase().split(/[\s,]+/).filter(s => /^[A-Z]{4}$/.test(s));
  if (!newOnes.length) { alert('Enter valid 4-letter ICAO codes (e.g. KCLL KDFW)'); return; }
  newOnes.forEach(icao => { if (!airports.includes(icao)) airports.push(icao); });
  document.getElementById('airport-input').value = '';
  refreshAll();
}

document.getElementById('airport-input')
  .addEventListener('keydown', e => { if (e.key === 'Enter') addAirports(); });

function resetDefaults() {
  Object.values(markers).forEach(mk => map.removeLayer(mk));
  markers = {}; metarData = {};
  airports = [
    'KCLL','KHOU','KDFW','KSAT','KAUS','KIAH','KELP','KAMA',
    'KLBB','KABI','KMAF','KTYR','KACT','KSPS','KGGG','KBRO'
  ];
  refreshAll();
}

// Auto-refresh every 5 minutes
setInterval(refreshAll, 5 * 60 * 1000);

// Initial load
refreshAll();
</script>
</body>
</html>
